<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Sayı Kilidi</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            touch-action: none; 
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            text-align: center; 
            width: 90%; 
            max-width: 420px; 
            position: relative; 
        }

        .wide-container { max-width: 480px; }

        h1 { 
            color: #2c3e50; 
            margin-bottom: 15px; 
            font-size: clamp(26px, 7vw, 36px); 
            white-space: nowrap; 
        }

        .level-subtitle { 
            color: #34495e; 
            font-weight: 700; 
            line-height: 1.4; 
            margin-bottom: 25px; 
            font-size: clamp(14px, 4.5vw, 19px); 
            display: block; 
            white-space: nowrap; 
        }

        .btn-redirect { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 35px; 
            height: 35px; 
            background-color: #ff4d4d; 
            color: white; 
            text-decoration: none; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            font-weight: bold; 
            transition: 0.3s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            z-index: 101; 
        }

        .btn-redirect:hover { 
            background-color: #ff0000; 
            transform: scale(1.1); 
        }

        .btn-close { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 35px; 
            height: 35px; 
            background-color: #ff4d4d; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            padding: 0; 
            line-height: 1; 
            z-index: 100; 
        }

        .btn-close:hover { 
            background-color: #ff0000; 
            transform: scale(1.1); 
        }

        .level-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-top: 10px;
        }

        .btn-level { 
            background-color: #3498db; 
            color: white; 
            padding: 15px 0; 
            font-size: 22px; 
            margin: 0; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold; 
        }

        .btn-level:hover { 
            background-color: #2980b9; 
            transform: translateY(-3px); 
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }

        .hidden { display: none !important; }

        #score-board { 
            margin-bottom: 20px; 
            margin-top: 35px; 
            background: #f8f9fa; 
            padding: 15px; 
            padding-right: 50px; 
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            position: relative; 
            border: 2px solid #ecf0f1; 
            cursor: pointer; 
            transition: background-color 0.2s ease; 
        }

        #score-board:hover { background-color: #e9ecef; }
        #score-board:hover .btn-inspect { color: #3498db; }

        .main-stats { font-size: 18px; font-weight: bold; color: #2c3e50; }
        
        .sub-stats { 
            font-size: 15px; 
            font-weight: bold; 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            align-items: center;
        }

        .stat-correct { color: #27ae60; }
        .stat-wrong { color: #e74c3c; }
        .stat-divider { color: #bdc3c7; }

        .btn-inspect { 
            position: absolute; 
            top: 50%; 
            right: 10px; 
            transform: translateY(-50%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 12px; 
            font-weight: bold; 
            color: #2c3e50; 
            transition: 0.2s; 
            padding: 0; 
        }

        .btn-inspect span { 
            font-size: 24px; 
            margin-bottom: 2px; 
        }

        .table-list { 
            display: flex; 
            justify-content: space-between; 
            gap: 15px; 
            margin-top: 15px; 
            padding: 15px; 
            background: #f8f9fa; 
            border-radius: 15px; 
            border: 2px solid #ecf0f1; 
        }

        .table-column { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .table-row { font-size: 17px; font-weight: bold; padding-bottom: 5px; border-bottom: 1px dashed #ddd; text-align: left; white-space: nowrap; }
        .row-correct { color: #27ae60; }
        .row-wrong { color: #e74c3c; }
        .row-unanswered { color: #7f8c8d; }

        .btn-mistakes { 
            background-color: #e67e22; 
            color: white; 
            padding: 15px; 
            font-size: 20px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 15px; 
            transition: 0.3s; 
        }

        .btn-mistakes:hover { 
            background-color: #d35400; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.4); 
        }

        .question-area { 
            font-size: 45px; 
            font-weight: 900; 
            color: #2c3e50; 
            margin: 15px 0 25px 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
        }

        .answer-box { 
            display: inline-flex; 
            gap: 8px; 
            border: 3px solid #2c3e50; 
            border-radius: 10px; 
            padding: 5px 15px; 
            align-items: center; 
            height: 65px; 
            background-color: transparent; 
        }

        .digit-slot { 
            width: 35px; 
            height: 45px; 
            border-bottom: 5px solid #2c3e50; 
            font-size: 38px; 
            font-weight: 900; 
            text-align: center; 
            line-height: 45px; 
            transition: 0.2s; 
        }

        .digit-slot.question-mark { color: #e74c3c; } 
        .digit-slot.filled { color: #f39c12; }        
        .digit-slot.correct-text { color: #27ae60; }  
        .digit-slot.wrong-text { color: #e74c3c; }    

        .white-circle { 
            position: relative; 
            width: 240px; 
            height: 240px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            margin: 0 auto 10px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.1); 
            border: 3px solid #ecf0f1; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        #line-svg { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 10; 
        }

        .num-node { 
            position: absolute; 
            width: 60px; 
            height: 60px; 
            background: #f1f2f6; 
            color: #2c3e50; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: 1.8rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            transform: translate(-50%, -50%); 
            border: 2px solid #ced4da; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            user-select: none; 
            z-index: 15; 
        }

        .num-node:hover { 
            transform: translate(-50%, -50%) scale(1.1); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); 
            background: #e2e6ea; 
        }

        .num-node.selected { 
            background: #f39c12 !important; 
            color: white !important; 
            border-color: #f1c40f !important; 
            transform: translate(-50%, -50%) scale(1.15); 
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.6); 
            pointer-events: none; 
        }

        .num-node.correct-selection { 
            background: #27ae60 !important; 
            color: white !important; 
            border-color: #2ecc71 !important; 
            transform: translate(-50%, -50%) scale(1.15); 
            box-shadow: 0 0 15px rgba(39, 174, 96, 0.6); 
            pointer-events: none; 
        }

        .num-node.wrong-selection { 
            background: #e74c3c !important; 
            color: white !important; 
            border-color: #c0392b !important; 
            transform: translate(-50%, -50%) scale(1.15); 
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.6); 
            pointer-events: none; 
        }

        #message { 
            height: 30px; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 20px; 
            transition: 0.3s; 
            color: #34495e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        /* Özel Onay Ekranı (Modal) */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(3px); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            opacity: 1; 
            transition: opacity 0.3s ease; 
        }

        .modal-overlay.hidden { display: none !important; opacity: 0; }

        .modal-box { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 20px; 
            text-align: center; 
            width: 90%; 
            max-width: 380px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); 
            animation: popInModal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        @keyframes popInModal { 
            0% { transform: scale(0.8); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }

        .modal-buttons { 
            display: flex; 
            justify-content: space-between; 
            gap: 15px; 
            flex-wrap: wrap; 
        }

        .btn-modal-end, .btn-modal-continue { 
            flex: 1; 
            padding: 15px 10px; 
            font-size: 18px; 
            font-weight: 800; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            background: transparent; 
            min-width: 140px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .btn-modal-end { color: #e74c3c; border: 3px solid #e74c3c; }
        .btn-modal-end:hover { background: #e74c3c; color: white; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3); }
        .btn-modal-continue { color: #2ecc71; border: 3px solid #2ecc71; }
        .btn-modal-continue:hover { background: #2ecc71; color: white; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }
    </style>
</head>
<body>

<div id="level-screen" class="container wide-container">
    <a href="https://matfabe.com/oyunlar/" class="btn-redirect">×</a> 
    <h1>🔐 Sayı Kilidi</h1>
    <p class="level-subtitle">Kaçların Çarpımını Öğrenmek İstersin?<br>Seç ve Başla!</p>
    <div class="level-grid" id="levels"></div>
</div>

<div id="game-screen" class="container hidden">
    <button class="btn-close" onclick="endGame()">×</button>
    <div id="score-board" onclick="openInspectScreen()">
        <div class="main-stats">Skor: <span id="score-display">0</span> | Seviye: <span id="level-display">6</span><span id="level-suffix">'lar</span></div>
        <div class="sub-stats">
            <span class="stat-correct">✔ Doğru: <span id="count-correct">0</span></span>
            <span class="stat-divider">|</span>
            <span class="stat-wrong">✖ Yanlış: <span id="count-wrong">0</span></span>
        </div>
        <div class="btn-inspect"><span>🔍</span>İncele</div>
    </div>
    <div class="question-area" id="question-area"></div>
    <div class="white-circle" id="circle-container">
        <svg id="line-svg">
            <polyline id="drag-line" fill="none" stroke="#f39c12" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
        </svg>
    </div>
    <p id="message">Rakamları sırayla seç veya birleştir!</p>
</div>

<div id="inspect-screen" class="container hidden">
    <button class="btn-close" onclick="closeInspectScreen()">×</button>
    <div id="score-board" style="padding-right: 15px; cursor: default;">
        <div class="main-stats">Skor: <span id="insp-score">0</span></div>
        <div class="sub-stats">
            <span class="stat-correct">✔ Doğru: <span id="insp-correct">0</span></span>
            <span class="stat-divider">|</span>
            <span class="stat-wrong">✖ Yanlış: <span id="insp-wrong">0</span></span>
        </div>
    </div>
    <h2 style="color: #2c3e50; margin: 10px 0;"><span id="insp-level-title">6</span><span id="insp-level-suffix">'lar</span> Çarpım Tablosu</h2>
    <div id="table-list" class="table-list"></div>
    <button class="btn-mistakes" onclick="startMistakeMode()">Sadece Yanlışlara Çalış</button>
</div>

<div id="custom-confirm-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-buttons">
            <button class="btn-modal-end" onclick="confirmEndGame()">Oyunu Bitir</button>
            <button class="btn-modal-continue" onclick="cancelEndGame()">Oyuna Devam Et</button>
        </div>
    </div>
</div>

<script>
    let currentLevel = 1; 
    let currentMultiplier = 1; 
    let answerString = ""; 
    let currentAnswerIndex = 0; 
    let selectedNodes = []; 
    let currentAttempt = ""; 
    let isChecking = false; 
    let isDragging = false;
    let points = []; 
    let currentMousePos = null; 
    let score = 0; 
    let correctCount = 0; 
    let wrongCount = 0; 
    let historyData = {}; 
    let isMistakeMode = false; 
    let mistakeQueue = []; 
    let fixedMistakesThisSession = 0; 

    function showScreen(screenId) {
        document.getElementById('level-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('inspect-screen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    function generateLevelButtons() {
        const levelsDiv = document.getElementById('levels'); 
        levelsDiv.innerHTML = ""; 
        for (let i = 1; i <= 9; i++) {
            let btn = document.createElement('button');
            let suffix = [1, 2, 3, 4, 5, 7, 8].includes(i) ? "'ler" : "'lar";
            btn.innerText = i + suffix; 
            btn.className = "btn-level"; 
            btn.onclick = () => startLevel(i);
            levelsDiv.appendChild(btn);
        }
    }
    
    window.onload = () => {
        generateLevelButtons();
        window.addEventListener('mousemove', handleMove); 
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('mouseup', endDrag); 
        window.addEventListener('touchend', endDrag);
    };

    function startLevel(level) {
        currentLevel = level; 
        document.getElementById('level-display').innerText = level;
        let suffix = [1, 2, 3, 4, 5, 7, 8].includes(level) ? "'ler" : "'lar";
        document.getElementById('level-suffix').innerText = suffix;
        document.getElementById('insp-level-title').innerText = level; 
        document.getElementById('insp-level-suffix').innerText = suffix;
        isMistakeMode = false; 
        mistakeQueue = []; 
        score = 0; 
        correctCount = 0; 
        wrongCount = 0; 
        historyData = {}; 
        updateScoreBoard(); 
        showScreen('game-screen'); 
        generateQuestion();
    }

    function updateScoreBoard() {
        document.getElementById('score-display').innerText = score; 
        document.getElementById('count-correct').innerText = correctCount;
        document.getElementById('count-wrong').innerText = wrongCount;
    }

    function generateQuestion() {
        document.getElementById('message').innerText = "Rakamları sırayla seç veya birleştir!"; 
        document.getElementById('message').style.color = "#34495e";
        
        isChecking = false; 
        isDragging = false; 
        currentAnswerIndex = 0; 
        currentAttempt = ""; 
        selectedNodes = []; 
        points = [];
        
        document.getElementById('drag-line').setAttribute('stroke', '#f39c12'); 
        updateLine();

        if (isMistakeMode) {
            currentMultiplier = mistakeQueue[Math.floor(Math.random() * mistakeQueue.length)];
        } else {
            currentMultiplier = Math.floor(Math.random() * 10) + 1; 
        }

        const targetResult = currentLevel * currentMultiplier; 
        answerString = targetResult.toString();
        const questionArea = document.getElementById('question-area');
        
        let htmlStr = `<span>${currentLevel} x ${currentMultiplier} = </span>`;
        let boxHtml = `<div class="answer-box">`;
        
        for(let i = 0; i < answerString.length; i++) {
            let content = (i === 0) ? "?" : ""; 
            let extraClass = (i === 0) ? " question-mark" : "";
            boxHtml += `<div class="digit-slot${extraClass}" id="digit-box-${i}">${content}</div>`;
        }
        boxHtml += `</div>`; 
        questionArea.innerHTML = htmlStr + boxHtml;

        const container = document.getElementById('circle-container');
        container.querySelectorAll('.num-node').forEach(n => n.remove());
        
        let circleNums = answerString.split(''); 
        let attempt = 0;
        
        while(circleNums.length < 4 && attempt < 100) {
            let rnd = Math.floor(Math.random() * 10).toString(); 
            if (!circleNums.includes(rnd)) {
                circleNums.push(rnd);
            }
            attempt++;
        }
        
        circleNums.sort(() => Math.random() - 0.5); 
        const radius = 90; 
        
        circleNums.forEach((numStr, i) => {
            const btn = document.createElement('div'); 
            btn.className = 'num-node'; 
            btn.innerText = numStr;
            const angle = (i * Math.PI / 2) - (Math.PI / 4); 
            const x = 120 + radius * Math.cos(angle); 
            const y = 120 + radius * Math.sin(angle);
            btn.style.left = `${x}px`; 
            btn.style.top = `${y}px`;
            btn.addEventListener('mousedown', (e) => startDrag(e, numStr, btn));
            btn.addEventListener('touchstart', (e) => startDrag(e, numStr, btn), {passive: false});
            container.appendChild(btn);
        });
    }

    function startDrag(e, value, node) { 
        if (isChecking) return; 
        isDragging = true; 
        if (!node.classList.contains('selected')) {
            processSelection(value, node); 
        }
    }

    function handleMove(e) {
        if (!isDragging || isChecking) return;
        if (e.cancelable) e.preventDefault(); 
        let clientX, clientY;
        if (e.type.includes('touch')) { 
            clientX = e.touches[0].clientX; 
            clientY = e.touches[0].clientY; 
        } else { 
            clientX = e.clientX; 
            clientY = e.clientY; 
        }
        
        const containerRect = document.getElementById('circle-container').getBoundingClientRect();
        currentMousePos = { x: clientX - containerRect.left, y: clientY - containerRect.top };
        const elem = document.elementFromPoint(clientX, clientY);
        
        if (elem && elem.classList.contains('num-node')) {
            const numStr = elem.innerText;
            if (!elem.classList.contains('selected')) {
                processSelection(numStr, elem);
            }
        }
        updateLine();
    }

    function endDrag() { 
        if (!isDragging) return; 
        isDragging = false; 
        currentMousePos = null; 
        updateLine(); 
    }

    function updateLine() {
        const polyline = document.getElementById('drag-line');
        if (points.length === 0) { 
            polyline.setAttribute('points', ''); 
            return; 
        }
        let ptsStr = points.join(' ');
        if (isDragging && currentMousePos) {
            ptsStr += ` ${currentMousePos.x},${currentMousePos.y}`;
        }
        polyline.setAttribute('points', ptsStr);
    }

    function processSelection(clickedValue, btnElement) {
        if (isChecking) return;
        let expectedDigit = answerString[currentAnswerIndex];
        
        if (clickedValue === expectedDigit) {
            btnElement.classList.add('selected'); 
            selectedNodes.push(btnElement);
            
            const containerRect = document.getElementById('circle-container').getBoundingClientRect();
            const nodeRect = btnElement.getBoundingClientRect();
            const x = nodeRect.left + nodeRect.width/2 - containerRect.left;
            const y = nodeRect.top + nodeRect.height/2 - containerRect.top;
            points.push(`${x},${y}`);
            
            let slot = document.getElementById(`digit-box-${currentAnswerIndex}`);
            slot.innerText = clickedValue; 
            slot.classList.remove('question-mark'); 
            slot.classList.add('filled');
            currentAttempt += clickedValue; 
            currentAnswerIndex++; 
            updateLine();
            
            if (currentAnswerIndex < answerString.length) {
                let nextSlot = document.getElementById(`digit-box-${currentAnswerIndex}`);
                nextSlot.innerText = "?"; 
                nextSlot.classList.add("question-mark");
            }
            if (currentAnswerIndex === answerString.length) { 
                endDrag(); 
                checkAnswerFinal(true); 
            }
        } else {
            btnElement.classList.add('wrong-selection');
            let slot = document.getElementById(`digit-box-${currentAnswerIndex}`);
            slot.innerText = clickedValue; 
            slot.classList.remove('question-mark'); 
            slot.classList.add('wrong-text');
            endDrag(); 
            checkAnswerFinal(false);
        }
    }

    function checkAnswerFinal(isCorrect) {
        isChecking = true; 
        const msgBox = document.getElementById('message');
        
        if (isCorrect) {
            document.getElementById('drag-line').setAttribute('stroke', '#27ae60');
            selectedNodes.forEach(node => { 
                node.classList.remove('selected'); 
                node.classList.add('correct-selection'); 
            });
            for(let i = 0; i < answerString.length; i++) {
                let slot = document.getElementById(`digit-box-${i}`);
                slot.classList.remove('filled'); 
                slot.classList.add('correct-text');
            }
            msgBox.innerText = "Mükemmel! 🎉"; 
            msgBox.style.color = "#27ae60";
            score += 10; 
            correctCount++; 
            updateScoreBoard(); 
            historyData[currentMultiplier] = 'correct';
            
            if (isMistakeMode) {
                mistakeQueue = mistakeQueue.filter(m => m !== currentMultiplier); 
                fixedMistakesThisSession++; 
                if (mistakeQueue.length === 0) {
                    setTimeout(() => { 
                        alert("Tebrikler! Tüm yanlışlarını öğrendin. 🎉"); 
                        isMistakeMode = false; 
                        generateQuestion(); 
                        openInspectScreen(); 
                    }, 1000);
                    return; 
                }
            }
            setTimeout(() => { generateQuestion(); }, 1000); 
        } else {
            document.getElementById('drag-line').setAttribute('stroke', '#e74c3c');
            for(let i = 0; i < answerString.length; i++) {
                let slot = document.getElementById(`digit-box-${i}`);
                if (slot.classList.contains('filled')) { 
                    slot.classList.remove('filled'); 
                    slot.classList.add('wrong-text'); 
                }
            }
            msgBox.innerText = `Maalesef yanlış, tekrar dene!`; 
            msgBox.style.color = "#c0392b";
            wrongCount++; 
            updateScoreBoard(); 
            historyData[currentMultiplier] = 'wrong';
            setTimeout(() => { generateQuestion(); }, 1500); 
        }
    }

    function endGame() {
        if (isMistakeMode) {
            alert(`Tebrikler! ${fixedMistakesThisSession} tane yanlış düzelttiniz.\nKalan düzeltilmesi gereken yanlış sayısı: ${mistakeQueue.length}`);
            isMistakeMode = false; 
            openInspectScreen(); 
        } else { 
            document.getElementById('custom-confirm-modal').classList.remove('hidden'); 
        }
    }
    
    function confirmEndGame() { 
        document.getElementById('custom-confirm-modal').classList.add('hidden'); 
        showScreen('level-screen'); 
    }
    
    function cancelEndGame() { 
        document.getElementById('custom-confirm-modal').classList.add('hidden'); 
    }

    function openInspectScreen() {
        showScreen('inspect-screen');
        document.getElementById('insp-score').innerText = score;
        document.getElementById('insp-correct').innerText = correctCount;
        document.getElementById('insp-wrong').innerText = wrongCount;
        document.getElementById('insp-level-title').innerText = currentLevel;
        document.getElementById('insp-level-suffix').innerText = [1, 2, 3, 4, 5, 7, 8].includes(currentLevel) ? "'ler" : "'lar";
        
        const listDiv = document.getElementById('table-list'); 
        listDiv.innerHTML = "";
        let col1 = document.createElement('div'); 
        col1.className = "table-column"; 
        let col2 = document.createElement('div'); 
        col2.className = "table-column";
        
        for(let i = 1; i <= 10; i++) {
            let div = document.createElement('div'); 
            div.className = "table-row";
            let statusHTML = "", rowClass = "row-unanswered";
            if (historyData[i] === 'correct') { 
                statusHTML = "✔ "; 
                rowClass = "row-correct"; 
            } else if (historyData[i] === 'wrong') { 
                statusHTML = "✖ "; 
                rowClass = "row-wrong"; 
            } else { 
                statusHTML = "<span style='opacity:0;'>✔ </span>"; 
            }
            div.innerHTML = `<span class="${rowClass}">${statusHTML} ${currentLevel} x ${i} = ${currentLevel * i}</span>`;
            if (i <= 5) {
                col1.appendChild(div); 
            } else {
                col2.appendChild(div);
            }
        }
        listDiv.appendChild(col1); 
        listDiv.appendChild(col2);
    }

    function closeInspectScreen() { 
        showScreen('game-screen'); 
    }

    function startMistakeMode() {
        mistakeQueue = [];
        for (let i = 1; i <= 10; i++) {
            if (historyData[i] === 'wrong') {
                mistakeQueue.push(i);
            }
        }
        if (mistakeQueue.length === 0) { 
            alert("Harika! Hiç yanlışınız yok."); 
            return; 
        }
        fixedMistakesThisSession = 0; 
        isMistakeMode = true; 
        showScreen('game-screen'); 
        generateQuestion();
    }
</script>
</body>
</html>
